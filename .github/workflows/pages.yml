# Deploy the download site (website/) to GitHub Pages.
#
# The page is static and fetches the GitHub Releases API at load time, so it needs no
# build step. This workflow only publishes the files. Enable Pages via:
#   Settings → Pages → Source: GitHub Actions
# (i.e. "Deploy from a branch" must NOT be selected — let the workflow own it.)
#
# The site will be available at https://<owner>.github.io/<repo>/ once the repo is public.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
